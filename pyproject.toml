[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-scorecard"
version = "0.2.0"
description = "Reproducible WoE credit scorecard with separate validation and test evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Miftahul Jannat Jessica"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scikit-learn>=1.3,<2", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "joblib>=1.3,<2"]

[project.scripts]
credit-scorecard = "credit_scorecard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
